# Faster R-CNN training profile (matches the notebook's hyper-parameters).
device: auto
data:
  batch_size: 8
  num_workers: 4
  image_size: 600
  train_on_positives_only: true
training:
  epochs: 5
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  lr_step_size: 5
  lr_gamma: 0.1
  print_freq: 50
  seed: 0
